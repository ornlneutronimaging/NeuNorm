name: Update lockfiles

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *" # 05:00 UTC on the 1st of each month

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    steps:
      # Mint an App installation token so the PR is created by the App identity,
      # not GITHUB_TOKEN. PRs opened with GITHUB_TOKEN cannot trigger other
      # workflows (GitHub recursion guard), which left the lockfile PR CI held
      # on "Approve and run"; an App token opens the PR as a first-class PR.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LOCKFILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Pin to the same pixi the rest of CI uses, so the regenerated
          # lockfile stays in a format the pinned CI pixi can read.
          pixi-version: v0.70.1
          run-install: false

      - name: Update lockfiles
        run: |
          set -o pipefail
          # `pixi exec` fetches and runs pixi-diff-to-markdown in an ephemeral
          # environment, so no separate install step is needed.
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: Update pixi lockfile
          title: Update pixi lockfile
          body-path: diff.md
          branch: update-pixi
          labels: pixi
          delete-branch: true
          add-paths: pixi.lock
